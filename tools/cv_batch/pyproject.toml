[project]
name = "cv-batch"
version = "0.1.0"
description = "Interactive batch tailoring of one-page CVs per job posting (local generator + a CLI agent)"
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit>=3.0.53",
]

[project.scripts]
cv = "cv_batch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_batch"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: runs the real CV generator on temporary paths",
]
