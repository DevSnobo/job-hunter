[project]
name = "job-cli"
version = "0.1.0"
description = "Private command-line tracker for submitted job applications (SQLite backed)"
requires-python = ">=3.12"
dependencies = [
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
job = "job_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_cli"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
